<head>

<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1b1a22;--mut:#6d6a78;--line:#e3dfd6;--p1:#3f6394;--p2:#8e4a68;--acc:#e4c466}
[data-theme=away]{--bg:#17121f;--card:#241c30;--ink:#f1ecf8;--mut:#a79fb8;--line:#372d47;--p1:#2b2438;--p2:#59457a;--acc:#d3a06f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(100deg,var(--p1),var(--p2));padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.35rem;color:var(--acc);text-shadow:0 1px 3px #000a}
header button{background:#0006;color:#fff;border:0;border-radius:10px;padding:6px 10px;font-size:1.1rem}
main{max-width:640px;margin:0 auto;padding:14px}
nav{display:flex;gap:8px;margin-bottom:14px}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit}
nav button.on{background:var(--p1);color:#fff;border-color:var(--p1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:10px 0;text-align:center}
.row b{font-size:1.05rem}.sc{font-size:1.4rem;font-weight:700;color:var(--p2);min-width:56px}
[data-theme=away] .sc{color:var(--acc)}
form.g{display:flex;gap:8px;align-items:center;justify-content:center}
form.g input{width:52px;text-align:center;font:inherit;font-size:1.2rem;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button.pri,form.g button{background:var(--p2);color:#fff;border:0;border-radius:10px;padding:8px 16px;font:inherit}
[data-theme=away] button.pri,[data-theme=away] form.g button{background:var(--acc);color:#1b1a22}
.tag{display:inline-block;background:var(--acc);color:#1b1a22;border-radius:8px;padding:0 8px;font-size:.8rem;font-weight:600}
.oth{margin-top:8px;font-size:.88rem;color:var(--mut)}
.pts{font-weight:700}.pos{color:#18884a}.neg{color:#c0392b}
.hint{font-size:.8rem;color:var(--mut);text-align:center;margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 6px;text-align:start;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;font-size:.85rem}
td.n{font-weight:700}
#vbtn{position:fixed;inset-inline:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:9;padding:12px 14px;border:0;border-radius:999px;background:var(--p2,#a50044);color:#fff;font:inherit;font-weight:700;box-shadow:0 4px 14px #0004;animation:vpulse 1.6s ease-in-out infinite}#vbtn[hidden]{display:none}@keyframes vpulse{50%{transform:scale(1.04)}}
#msg{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:9;text-align:center}
.center{text-align:center;padding:40px 10px}.center input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;margin:10px 0;width:100%;max-width:260px;text-align:center;background:var(--card);color:var(--ink)}
.boost{background:var(--bg);border:2px dashed var(--acc);border-radius:12px;padding:10px;margin:8px 0;text-align:center;font-size:.92rem}.bs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}.bs button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700}.rules h3{margin:16px 0 4px;color:var(--p2)}.rules h3:first-child{margin-top:0}.rules li,.rules p{margin:4px 0}.rules ol,.rules ul{padding-inline-start:22px;margin:4px 0}
header h1{display:flex;align-items:center;gap:10px}header h1 img{border-radius:9px}
.card{animation:up .35s ease both}@keyframes up{from{opacity:0;transform:translateY(8px)}}
button{transition:transform .12s,opacity .12s}button:active{transform:scale(.96)}
.tag{animation:pop .4s ease both}@keyframes pop{from{transform:scale(.6)}60%{transform:scale(1.15)}}
.hint2{text-align:center;font-size:.9rem;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit}
#sheet{position:fixed;inset:0;z-index:8}#sheet .back{position:absolute;inset:0;background:#0007}
#sheet .panel{position:absolute;top:0;inset-inline:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:0 0 20px 20px;padding:calc(10px + env(safe-area-inset-top)) 16px 16px;max-height:92vh;overflow:auto;animation:down .25s ease both}
@keyframes down{from{transform:translateY(-16px);opacity:0}}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line)}.mi:last-child{border:0}.mi small{color:var(--mut)}
#sheet .rules{border:0;padding:6px 0;margin:0;animation:none}
#sheet input[type=text]{font:inherit;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;margin:6px 0}
.ad h4{margin:16px 0 4px;color:var(--p2)}.ad small{display:block}.ad .mi{font-size:.92rem}.ad .mi>div{min-width:0;overflow-wrap:anywhere}
button.dng{background:#b03a2e;color:#fff;border:0;border-radius:10px;padding:6px 12px;font:inherit}
.ok{color:#18884a}.bad{color:#c0392b}
details.all{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}details.all summary{margin:2px 0 6px;font-size:.88rem}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}.gl div{display:flex;justify-content:space-between;gap:6px;font-size:.9rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.gl .me{font-weight:700;color:var(--p2)}.gl .no{color:var(--mut)}.gl small{font-weight:700}
tr[data-p]{cursor:pointer}tr[data-p]:active{background:var(--bg)}
.ph .mi{font-size:.92rem}.ph small{display:block}.sum{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:.9rem;margin:6px 0}
#hb{display:flex;gap:8px}#hb[hidden]{display:none}
details summary{cursor:pointer;margin:10px 0;color:var(--mut)}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.big{font-size:2.6rem;font-weight:800;text-align:center;letter-spacing:2px;color:var(--p2)}[data-theme=away] .big{color:var(--acc)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e53935;margin-inline-start:6px;vertical-align:middle;animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.25}}
.gr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;margin:6px 0;border:1px solid var(--line);transition:background .4s,border-color .4s}
.gr.exact{background:#18884a26;border-color:#18884a}.gr.direction{background:#d9a40024;border-color:#d9a400}.gr.miss{background:#c0392b14;border-color:#c0392b66}.gr.none{opacity:.6;border-style:dashed}
.gr .gs{font-weight:700;font-size:1.1rem}
.s2{display:inline-flex;direction:rtl;unicode-bidi:isolate;gap:.05em}.gr small{color:var(--mut)}.gr.me{box-shadow:inset 3px 0 0 var(--p2)}
.lg{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:.8rem;color:var(--mut);margin:6px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
.mv{font-size:.75rem;font-weight:700;margin-inline-start:4px}.up{color:#18884a}.dn{color:#c0392b}.prov{color:#18884a;font-size:.8rem;font-weight:700;margin-inline-start:4px}
tr.chg td{animation:flash 1.2s ease}@keyframes flash{from{background:#e4c46655}}
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:none}.sw input{opacity:0;width:0;height:0;position:absolute}.sw i{position:absolute;inset:0;border-radius:26px;background:var(--line);transition:background .2s}.sw i:before{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004;transition:transform .2s}.sw input:checked+i{background:var(--p2)}[data-theme=away] .sw input:checked+i{background:var(--acc)}.sw input:checked+i:before{transform:translateX(-20px)}.sw input:focus-visible+i{outline:2px solid var(--acc)}
.mi.sub{padding-inline-start:22px;font-size:.92rem}
#panel .mi>span>small{display:block}
#tour{position:fixed;inset:0;z-index:20}#tour .dim{position:fixed;inset:0;background:#000a}
#tour .hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px #000a;pointer-events:none;outline:2px solid var(--acc);transition:all .3s ease}
#tour .tc{position:fixed;inset-inline:16px;max-width:420px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:16px;padding:16px;box-shadow:0 10px 30px #0007;animation:up .3s ease both}
#tour .tc b{font-size:1.08rem}#tour .tc p{margin:8px 0 12px}
#tour .tb{display:flex;justify-content:space-between;align-items:center;gap:8px}#tour .tb span{color:var(--mut);font-size:.85rem}
</style>
</head>
<body>
<header><h1><img src="icon.svg" alt="" width="34" height="34">מלך התחזיות</h1><div id="hb" hidden><button id="rbtn" aria-label="חוקי המשחק">📖</button><button id="sbtn" aria-label="צלילים">🔊</button><button id="gear" aria-label="הגדרות">⚙️</button></div></header>
<main id="app"><div class="center">טוען…</div></main>
<div id="msg"></div><button id="vbtn" hidden>🔊 יש לך הודעה קולית · הקש להשמעה</button>
<div id="sheet" hidden><div class="back"></div><div class="panel" id="panel"></div></div>
<script src="config.js"></script>
<script src="teams.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const C=window.APP_CONFIG||{};
const sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_KEY);
const app=document.getElementById('app');
// score shown home-on-the-right, matching the RTL team row (home team is on the right)
const SC=(h,a)=>`<span class="s2"><span>${h}</span><span>:</span><span>${a}</span></span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Intl.DateTimeFormat('he-IL',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Jerusalem'}).format(new Date(d));
const team=n=>window.teamHe?window.teamHe(n):n;
const ST={SCHEDULED:'עתידי',TIMED:'עתידי',IN_PLAY:'במשחק',PAUSED:'מחצית',FINISHED:'הסתיים',POSTPONED:'נדחה',CANCELLED:'בוטל',SUSPENDED:'הופסק'};
const ERR={guess_window_closed:'המשחק כבר התחיל, הניחושים נסגרו',match_closed:'המשחק סגור לניחושים',not_member:'צריך להצטרף עם קוד הזמנה',invalid_code:'קוד הזמנה שגוי',invalid_amount:'ערך לא תקין',pushups_deadline_passed:'הזמן לחלוקה עבר (המשחק הבא כבר התחיל)',pushups_already_distributed:'כבר חילקת את השכיבות האלה',pushups_over_limit:'חילקת יותר שכיבות ממה שמגיע לך',not_your_award:'השכיבות האלה לא שלך לחלק',invalid_count:'מספר לא תקין',invalid_name:'השם חייב להיות בין 2 ל-30 תווים',forbidden:'אין הרשאה',cannot_remove_self:'אי אפשר להסיר את עצמך',invalid_code_format:'הקוד חייב להכיל 8-40 אותיות באנגלית, ספרות ומקפים בלבד'};
let me=null,tab=new URLSearchParams(location.search).get('tab')==='live'?'live':'games',D={},PS=null;
const toast=(t,k)=>{const m=document.getElementById('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',3500);k=k||(String(t).includes('✓')?'ok':null);if(k)sfx(k)};
// ---- sounds (generated in the browser, no audio files) ----
let AC=null;
const sfxOn=()=>{try{return localStorage.getItem('sfx')!=='0'}catch{return true}};
const setSfx=v=>{try{localStorage.setItem('sfx',v?'1':'0')}catch{}};
function tone(f,t0,d,type='sine',vol=.18){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function sfx(k){
  if(!sfxOn())return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    if(k==='ok'){tone(659,0,.14);tone(880,.12,.22)}
    else if(k==='err'){tone(220,0,.18,'square',.08);tone(165,.16,.26,'square',.08)}
    else if(k==='boost'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.26))}
    else if(k==='chime'){tone(988,0,.2);tone(1319,.18,.32)}
  }catch{}
}
// ---- voice messages played when a player breaks a rule (files listed in config.js VOICE_FILES) ----
const VF=()=>C.VOICE_FILES||{};
const VPOOL=()=>C.VOICE_POOLS||{};
const hasPools=()=>Object.values(VPOOL()).some(a=>Array.isArray(a)&&a.length);
const hasVoices=()=>Object.values(VF()).some(Boolean);
const voiceOn=()=>{try{return localStorage.getItem('voice')!=='0'}catch{return true}};
const setVoice=v=>{try{localStorage.setItem('voice',v?'1':'0')}catch{}};
const vcache={};
function voice(k){
  const f=VF()[k]||VF().generic;
  if(f&&voiceOn()){
    try{const key=VF()[k]?k:'generic',a=vcache[key]||(vcache[key]=new Audio(f));a.currentTime=0;a.play().catch(()=>sfx('err'));return}catch{}
  }
  sfx('err');
}
// ---- voice pools: after a match (exact / direction / miss / no guess) and the guess reminder ----
// config.js VOICE_POOLS lists the files of each event; one is picked at random (not the same one twice in a row)
const vresOn=()=>{try{return localStorage.getItem('vres')!=='0'}catch{return true}};
const setVres=v=>{try{localStorage.setItem('vres',v?'1':'0')}catch{}};
const lsJ=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const lsS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let VP=null,vpUnlocked=false,vq=[],vBusy=false;
function pickVoice(kind){
  const L=(VPOOL()[kind]||[]).filter(Boolean);if(!L.length)return null;
  const last=lsJ('vlast',{});let opts=L.length>1?L.filter(f=>f!==last[kind]):L;
  const f=opts[Math.floor(Math.random()*opts.length)];last[kind]=f;lsS('vlast',last);return f;
}
function vNext(){
  const b=document.getElementById('vbtn');
  if(vBusy||!vq.length){if(b&&!vq.length)b.hidden=true;return}
  if(b)b.hidden=true;
  const f=vq.shift();vBusy=true;VP=VP||new Audio();VP.muted=false;VP.src=encodeURI(f);VP.currentTime=0;
  const done=()=>{vBusy=false;VP.onended=VP.onerror=null;setTimeout(vNext,400)};
  VP.onended=done;VP.onerror=done;
  VP.play().catch(()=>{vBusy=false;vpUnlocked=false;vq.unshift(f);if(b)b.hidden=false});
}
function playPool(kind){if(!vresOn())return;const f=pickVoice(kind);if(f){vq.push(f);vNext()}}
// what to say now: the result of the last settled match (once), and the reminder for a match not guessed yet (once)
function checkVoices(){
  if(!me?.is_approved||!hasPools()||!D.matches)return;
  const heard=lsJ('vheard',[]),now=Date.now(),mark=k=>{heard.push(k);lsS('vheard',heard.slice(-60))};
  const done=D.matches.filter(m=>m.settled_at&&!m.voided&&now-Date.parse(m.settled_at)<24*36e5)
    .sort((a,b)=>Date.parse(b.utc_date)-Date.parse(a.utc_date));
  const m=done[0];
  if(m&&!heard.includes('r'+m.id)){
    const l=D.ledger.find(x=>x.user_id===me.id&&x.match_id===m.id&&x.kind==='guess');
    const joined=me.created_at?Date.parse(me.created_at):0;
    const kind=l?({exact:'exact',direction:'direction',miss:'miss'})[l.note]:(joined<Date.parse(m.utc_date)?'no_guess':null);
    mark('r'+m.id);if(kind)playPool(kind);
  }
  const mins=me.reminder_minutes;
  if(mins){
    const nx=D.matches.find(x=>!x.voided&&['SCHEDULED','TIMED'].includes(x.status)&&Date.parse(x.utc_date)>now&&Date.parse(x.utc_date)-now<=mins*6e4);
    if(nx&&!heard.includes('g'+nx.id)&&!D.guesses.some(g=>g.match_id===nx.id&&g.user_id===me.id)){mark('g'+nx.id);playPool('reminder')}
  }
}
function fail(e){
  const k=Object.keys(ERR).find(k=>(e.message||'').includes(k));
  toast(errText(e),'none');voice(k||'generic');
}
// browsers only allow sound after a tap: on the first tap, unlock the audio engine and the voice files
function unlockAudio(){
  document.removeEventListener('click',unlockAudio,true);
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch{}
  if(hasPools()&&!vpUnlocked){const f=Object.values(VPOOL()).flat().find(Boolean);VP=VP||new Audio();
    if(vq.length){vpUnlocked=true;vNext()}
    else{VP.src=encodeURI(f);VP.muted=true;VP.play().then(()=>{VP.pause();VP.muted=false;vpUnlocked=true;vNext()}).catch(()=>{VP.muted=false})}}
  for(const [k,f] of Object.entries(VF())){if(!f||vcache[k])continue;const a=vcache[k]=new Audio(f);a.muted=true;a.play().then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false})}
}
document.addEventListener('click',unlockAudio,true);
document.addEventListener('click',()=>{if(vq.length&&!vBusy){vpUnlocked=true;vNext()}},true);
function updSoundIcon(){const b=document.getElementById('sbtn');if(b)b.textContent=(sfxOn()||(hasVoices()&&voiceOn())||(hasPools()&&vresOn())||musicPlaying())?'🔊':'🔇'}
// ---- background music (optional: set MUSIC_URL in config.js) ----
let music=null;
const musicPref=()=>{try{return localStorage.getItem('music')==='1'}catch{return false}};
const musicPlaying=()=>!!music&&!music.paused;
function musicSet(on){
  if(!C.MUSIC_URL)return;
  if(!music){music=new Audio(C.MUSIC_URL);music.loop=true;music.volume=.4}
  if(on)music.play().then(()=>{try{localStorage.setItem('music','1')}catch{}}).catch(()=>toast('לא ניתן להשמיע את המוזיקה','err'));
  else{music.pause();try{localStorage.setItem('music','0')}catch{}}
}
const musicFirstTap=e=>{if(e.target.closest('#sheet'))return;document.removeEventListener('click',musicFirstTap);if(musicPref()&&C.MUSIC_URL&&!music)musicSet(true)};
document.addEventListener('click',musicFirstTap);
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',async e=>{if(e.data?.type==='push'){sfx('chime');if(me?.is_approved&&hasPools()&&/^(result|guess)-/.test(e.data.tag||'')){await load();if(document.getElementById('sheet').hidden)render();checkVoices()}}if(e.data?.type==='open'&&/tab=live/.test(e.data.url||'')&&me?.is_approved){tab='live';await load();render()}});
const errText=e=>{const k=Object.keys(ERR).find(k=>(e.message||'').includes(k));return k?ERR[k]:'משהו השתבש, נסה שוב'+(e.message?' ('+String(e.message).slice(0,50)+')':'')};

function toggleTheme(){const h=document.documentElement,t=h.dataset.theme==='home'?'away':'home';h.dataset.theme=t;try{localStorage.setItem('theme',t)}catch{}}
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch{}

sb.auth.onAuthStateChange((ev,s)=>{if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED')return;setTimeout(()=>boot(s),0)});

async function boot(session){
  if(session&&me&&me.id===session.user.id&&me.is_approved)return;   // already running for this user: don't re-render
  if(!session){me=null;document.getElementById('hb').hidden=true;return login()}
  const {data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  me=p;if(!me){app.innerHTML='<div class="center">יוצר פרופיל…</div>';return setTimeout(async()=>boot((await sb.auth.getSession()).data.session),1500)}

function liveHtml(){

let prevRank={};

const tieCmp=(a,b)=>b.pts-a.pts||b.ex-a.ex||b.dr-a.dr||a.ow-b.ow;

  <table><tr><th>#</th><th>שחקן</th><th>נק׳</th><th>ניחושים</th><th>מדויקים</th><th>כיוון</th><th>💪</th></tr>${R.map((x,i)=>{const mv=basePlace[x.r.user_id]-x.place,shared=R.some(y=>y!==x&&y.place===x.place);

  <div class="hint">לחצו על שחקן כדי לראות את הניחושים שלו. "ניחושים" = משחקים שהסתיימו וניחשו בהם. 💪 = שכיבות סמיכה שנשאר לבצע. בשוויון נקודות: יותר מדויקים, אחר כך יותר כיוון, אחר כך פחות 💪; שוויון בכל אלה = מקום משותף (=).${lm?' הנקודות בירוק זמניות עד סיום המשחק.':''}</div></div>`;

const VAPID=C.VAPID_PUBLIC_KEY||'';
const b64=k=>{const r=atob((k+'='.repeat((4-k.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function pushState(){
  try{
    if(!('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window))return 'na';
    const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    return sub?'on':(Notification.permission==='denied'?'denied':'off');
  }catch{return 'na'}
}
const saveSub=sub=>{const j=sub.toJSON();return sb.rpc('save_push_subscription',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth})};
async function resync(){ // keep the server in sync with this device's subscription
  if(PS!=='on')return;
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub)await saveSub(sub)}catch{}
}
async function pushOn(){
  let sub=null;
  try{
    if(!VAPID||VAPID.startsWith('PASTE')){toast('חסר מפתח התראות בקובץ config.js')}
    else if(await Notification.requestPermission()!=='granted'){toast('ההתראות לא אושרו')}
    else{
      const reg=await navigator.serviceWorker.ready;
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});
      const {error}=await saveSub(sub);if(error)throw error;
      toast('ההתראות הופעלו ✓');
    }
  }catch(err){console.error(err);try{await sub?.unsubscribe()}catch{}toast('הפעלת ההתראות נכשלה')}
  PS=await pushState();sheet('main');
}
async function pushOff(){
  try{
    const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
    if(sub){await sb.rpc('delete_push_subscription',{p_endpoint:sub.endpoint});await sub.unsubscribe()}
    toast('ההתראות כובו');
  }catch(err){console.error(err)}
  PS=await pushState();sheet('main');
}

function tour(steps,onEnd){
  document.getElementById('tour')?.remove();
  const el=document.createElement('div');el.id='tour';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');document.body.append(el);
  let i=0;window.scrollTo(0,0);
  const show=()=>{
    const s=steps[i],last=i===steps.length-1,t=s.sel&&document.querySelector(s.sel),r=t&&t.getBoundingClientRect();
    const pos=!r?'top:22%':r.top<innerHeight/2?`top:${r.bottom+16}px`:`bottom:${innerHeight-r.top+16}px`;
    el.innerHTML=`${r?`<div class="hole" style="top:${r.top-6}px;left:${r.left-6}px;width:${r.width+12}px;height:${r.height+12}px"></div>`:'<div class="dim"></div>'}
    <div class="tc" style="${pos}"><b>${s.t}</b><p>${s.b}</p><div class="tb"><div>${last?'':'<button class="lnk" data-tr="end">דילוג</button>'}</div><span>${i+1}/${steps.length}</span><div>${i?'<button class="lnk" data-tr="prev">הקודם</button> ':''}<button class="pri" data-tr="${last?'end':'next'}">${last?'סיום':'הבא'}</button></div></div></div>`;
    el.querySelector('.tb .pri')?.focus({preventScroll:true});
  };
  const end=()=>{el.remove();removeEventListener('resize',show);onEnd?.()};
  el.addEventListener('click',e=>{const a=e.target.closest('[data-tr]')?.dataset.tr;if(a==='next'){i++;show()}else if(a==='prev'){i--;show()}else if(a==='end')end()});
  el.addEventListener('keydown',e=>{if(e.key==='Escape')end()});
  addEventListener('resize',show);show();
}
const seenTour=()=>{let l=0;try{l=Number(localStorage.getItem('tourv'))||0}catch{}return Math.max(l,me?.tour_version||0)};

function maybeTour(){

  const isNew=!D.guesses.some(g=>g.user_id===me.id);   // never guessed: the full tour; otherwise only what's new

}

  <div class="mi"><span>✏️ שם תצוגה: <b>${esc(me.display_name)}</b></span><button class="pri" data-s="name">עריכה</button></div>
  <div class="mi"><span>🧭 סיור באפליקציה<small>מעבר קצר על כל המסכים</small></span><button class="pri" data-s="tour">התחלה</button></div>
  ${me.is_admin?'<div class="mi"><span>🛠️ ניהול</span><button class="pri" data-s="admin">פתיחה</button></div>':''}
  <div class="mi"><span></span><button class="lnk" data-s="out">התנתקות</button></div>`;
}
document.addEventListener('click',async e=>{
  if(e.target.closest('#gear'))return sheet('main');
  if(e.target.closest('#rbtn'))return sheet('rules');
  if(e.target.closest('#sbtn'))return sheet('sound');
  if(e.target.classList.contains('back'))return sheet(null);
  const b=e.target.closest('[data-s]');if(!b)return;
  const a=b.dataset.s;
  if(a==='close')sheet(null);
  else if(a==='main'||a==='rules'||a==='name'||a==='admin')sheet(a);
  else if(a==='theme'){toggleTheme();sheet('main')}
  else if(a==='out'){sheet(null);sb.auth.signOut()}
  else if(a==='inst'&&dip){dip.prompt();await dip.userChoice;dip=null;sheet('main')}
  else if(a==='sfx'){const on=!sfxOn();setSfx(on);if(on)sfx('ok');updSoundIcon();sheet('sound')}
  else if(a==='voice'){setVoice(!voiceOn());updSoundIcon();sheet('sound')}
  else if(a==='vres'){const on=!vresOn();setVres(on);if(!on){vq=[];VP?.pause();vNext()}updSoundIcon();sheet('sound')}
  else if(a==='music'){musicSet(!musicPlaying());setTimeout(()=>{updSoundIcon();sheet('sound')},200)}
  else if(a==='tour'){sheet(null);tour(TOUR_FULL)}
  else if(a==='pon')await pushOn();
  else if(a==='poff')await pushOff();
});

const dt=d=>d?new Intl.DateTimeFormat('he-IL',{dateStyle:'short',timeStyle:'short',timeZone:'Asia/Jerusalem'}).format(new Date(d)):'—';
async function adminLoad(){
  const panel=document.getElementById('panel');
  const {data,error}=await sb.rpc('admin_overview');
  if(error){console.error(error);panel.innerHTML=`<div class="mi"><b>ניהול</b><button class="lnk" data-s="main">חזרה</button></div><div class="center">${errText(error)}<br><small>האם הרצת את 004_admin_and_profile.sql?</small></div>`;return}
  const ago=data.last_sync?Math.round((Date.now()-Date.parse(data.last_sync))/60000):null;
  const syncOk=ago!==null&&ago<400;
  const ms=data.members||[];
  const open=D.matches.filter(m=>!m.voided&&m.status!=='FINISHED').slice(0,10);
  const done=D.matches.filter(m=>!m.voided&&m.status==='FINISHED').slice(-3).reverse();
  const mrow=m=>`<div class="mi"><div>${esc(team(m.home_team))} - ${esc(team(m.away_team))}<small>${dt(m.utc_date)} · ${ST[m.status]||m.status}</small></div><button class="dng" data-ad="void" data-id="${m.id}">ביטול</button></div>`;
  panel.innerHTML=`<div class="ad"><div class="mi"><b>ניהול</b><button class="lnk" data-s="main">חזרה</button></div>
  <h4>מצב המערכת</h4>
  <div class="mi"><span>סנכרון משחקים אחרון</span><span class="${syncOk?'ok':'bad'}">${data.last_sync?'לפני '+ago+' דק׳':'אף פעם'}</span></div>
  ${(data.cron||[]).map(c=>`<div class="mi"><div>${esc(c.jobname)}<small>${dt(c.start_time)}${c.message?' · '+esc(c.message):''}</small></div><span class="${c.status==='succeeded'?'ok':'bad'}">${esc(c.status)}</span></div>`).join('')||'<small>אין נתוני cron</small>'}
  ${(data.http_recent||[]).length?`<small>תגובות HTTP אחרונות מהפונקציות: ${data.http_recent.map(h=>`<span class="${h.status_code===200?'ok':'bad'}">${h.status_code??'—'}</span>`).join(' ')}</small>`:''}
  <h4>קוד הזמנה</h4>
  <div class="mi"><b dir="ltr">${esc(data.invite_code)}</b><button class="pri" data-ad="code">שינוי</button></div>
  <h4>משתתפים (${ms.length})</h4>
  ${ms.map(u=>`<div class="mi"><div>${esc(u.name)}${u.admin?' 👑':''}<small dir="ltr">${esc(u.email)}</small><small>${u.approved?'חבר':'ממתין, לא הזין קוד'} · התראות: ${u.push>0?'כן':'לא'}</small></div><div>${u.id===me.id?'':`<button class="lnk" data-ad="appr" data-id="${u.id}" data-v="${u.approved?0:1}">${u.approved?'השעיה':'אישור'}</button> <button class="dng" data-ad="rm" data-id="${u.id}" data-n="${esc(u.name)}">הסרה</button>`}</div></div>`).join('')}
  <h4>💪 שכיבות סמיכה</h4>
  <small>סמן כמה שכיבות סמיכה שחקן ביצע בפועל. הסימון יורד מהחוב שלו.</small>
  ${ms.filter(u=>u.approved).map(u=>{const o=owed(u.id);return `<div class="mi"><span>${esc(u.name)}<small>נשאר לבצע: <b>${o}</b></small></span>${o>0?`<button class="pri" data-ad="pu" data-id="${u.id}" data-o="${o}" data-n="${esc(u.name)}">סימון ביצוע</button>`:''}</div>`}).join('')}
  <h4>ביטול משחק (דחייה / הפסקה)</h4>
  <small>מבטל את המשחק ומוחק את הניקוד ואת זכויות חלוקת השכיבות שלו. שכיבות שכבר חולקו נשארות. אי אפשר לשחזר.</small>
  ${open.map(mrow).join('')}${done.length?'<small>הסתיימו לאחרונה</small>'+done.map(mrow).join(''):''}
  </div>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-ad]');if(!b)return;
  const a=b.dataset.ad,id=b.dataset.id;let r;
  if(a==='void'){
    if(!confirm('לבטל את המשחק? הניקוד שלו יימחק. אי אפשר לשחזר.'))return;
    r=await sb.rpc('void_match',{p_match_id:Number(id),p_reason:'admin'});
  }else if(a==='pu'){
    const c=prompt(`כמה שכיבות סמיכה ${b.dataset.n} ביצע? (נשאר: ${b.dataset.o})`,b.dataset.o);if(!c)return;
    const n=Math.floor(Number(c));if(!(n>0&&n<=Number(b.dataset.o)))return toast(ERR.invalid_count,'err');
    r=await sb.rpc('admin_mark_pushups',{p_user_id:id,p_count:n});
  }else if(a==='rm'){
    if(!confirm('להסיר את '+b.dataset.n+' לצמיתות? כל הניחושים והנקודות שלו יימחקו.'))return;
    r=await sb.rpc('admin_remove_user',{p_user_id:id});
  }else if(a==='appr'){
    r=await sb.rpc('admin_set_approved',{p_user_id:id,p_approved:b.dataset.v==='1'});
  }else if(a==='code'){
    const c=prompt('קוד הזמנה חדש (8-40 תווים: אותיות באנגלית, ספרות ומקפים)');if(!c)return;
    r=await sb.rpc('admin_set_invite_code',{p_code:c.trim()});
  }
  if(r?.error)return fail(r.error);
  toast('בוצע ✓');await load();render();adminLoad();
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-s="namesave"]');if(!b)return;
  const v=document.getElementById('nm').value.trim();
  const {error}=await sb.rpc('update_display_name',{p_name:v});
  if(error)return fail(error);
  me.display_name=v;toast('השם עודכן ✓');await load();render();sheet('main');
});
sb.auth.getSession().then(({data})=>boot(data.session));
</script>
